services:
  - type: web
    name: snabtash-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn snabtash_core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: snabtash-db
          property: connectionString

databases:
  - name: snabtash-db
    databaseName: snabtash
    user: snabtash_user
    plan: free

