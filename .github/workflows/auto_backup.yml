name: SNABTASH Live Catalog Auto-Backup

on:
  schedule:
    # Runs daily at 03:00 UTC (08:00 Tashkent time)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab
    inputs:
      commit_to_git:
        description: 'Commit updated catalog seed to git repository (default false)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backup:
    name: Backup Live Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live catalog from backend API
        run: |
          python backend/export_live_backup.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: snabtash-catalog-backup-${{ github.run_id }}
          path: backend/fixtures/live_backup.json
          retention-days: 30

      - name: Commit and push changes (only if explicitly requested)
        if: ${{ inputs.commit_to_git == true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/fixtures/live_backup.json
          
          if git diff --staged --quiet; then
            echo "Hech qanday o'zgarish yo'q. Commit qilinmadi."
          else
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "chore(backup): manual catalog snapshot update [$TIMESTAMP] [skip ci]"
            git push origin main
          fi
