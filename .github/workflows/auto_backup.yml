name: SNABTASH Live Database Auto-Backup

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  backup:
    name: Backup Live Cloud Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch live database from Render API
        run: |
          python backend/export_live_backup.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/fixtures/live_backup.json
          
          if git diff --staged --quiet; then
            echo "Hech qanday o'zgarish yo'q. Commit qilinmadi."
          else
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "chore(backup): auto-backup live database [$TIMESTAMP]"
            git push origin main
          fi
